<text x='676' y='600' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='9.5' fill='#1d7a46' text-anchor='middle' font-weight='600'>POST /reprocesar : el operador arregla la causa y reencola</text>
<rect x='24' y='630' width='1072' height='62' rx='6' fill='#f1f4f6' stroke='#c3ccd4' stroke-width='1'/>
<text x='40' y='650' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#1f2933' text-anchor='start' font-weight='650'>RECHAZADO  y  MUERTO no son lo mismo, y es la distincion que hace util a la cola:</text>
<text x='40' y='667' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10.2' fill='#a62828' text-anchor='start' font-weight='normal'>RECHAZADO = el mensaje esta mal. Reintentarlo daria el mismo error, asi que NO se reintenta.</text>
<text x='40' y='683' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10.2' fill='#8a5a00' text-anchor='start' font-weight='normal'>MUERTO = el mensaje estaba bien pero el destino fallo. Es un problema de infraestructura: se reintento 8 veces y queda para revision manual.</text>
