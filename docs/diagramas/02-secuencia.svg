<line x1='470' y1='298' x2='512' y2='298' stroke='#5c6b7a' stroke-width='1.3'/><line x1='512' y1='298' x2='512' y2='322' stroke='#5c6b7a' stroke-width='1.3'/><line x1='512' y1='322' x2='470' y2='322' stroke='#5c6b7a' stroke-width='1.3' marker-end='url(#punta)'/><text x='520' y='304' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10.3' fill='#5c6b7a' text-anchor='start' font-weight='600'>4. hash = SHA-256(contenido)</text><text x='520' y='318' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='9.3' fill='#5c6b7a' text-anchor='start' font-weight='normal'>la identidad del mensaje es su contenido</text>
<line x1='470' y1='355' x2='640' y2='355' stroke='#5c6b7a' stroke-width='1.3' marker-end='url(#punta)'/><text x='555.0' y='348' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10.3' fill='#5c6b7a' text-anchor='middle' font-weight='600'>5. INSERT ... ON CONFLICT DO NOTHING</text><text x='555.0' y='368' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='9.3' fill='#5c6b7a' text-anchor='middle' font-weight='normal'>la idempotencia la impone el UNIQUE</text>
<line x1='640' y1='398' x2='470' y2='398' stroke='#5c6b7a' stroke-width='1.3' stroke-dasharray='5,4' marker-end='url(#puntaAbierta)'/><text x='555.0' y='391' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10.3' fill='#5c6b7a' text-anchor='middle' font-weight='600'>6. reservado / duplicado</text>
