<line x1='470' y1='684' x2='640' y2='684' stroke='#a62828' stroke-width='1.3' marker-end='url(#puntaRoja)'/><text x='555.0' y='677' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10.3' fill='#a62828' text-anchor='middle' font-weight='600'>12a. estado=FALLIDO, proximo_intento=ahora+2^n</text><text x='555.0' y='697' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='9.3' fill='#5c6b7a' text-anchor='middle' font-weight='normal'>espera 2s, 4s, 8s... agotados los 8 intentos pasa a MUERTO</text>
<line x1='398' y1='718' x2='1070' y2='718' stroke='#a62828' stroke-width='1.1' stroke-dasharray='6,4'/>
<text x='408' y='734' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='9.5' fill='#a62828' text-anchor='start' font-weight='normal'>[else  -  HAPI responde]</text>
<line x1='820' y1='762' x2='470' y2='762' stroke='#1d7a46' stroke-width='1.3' stroke-dasharray='5,4' marker-end='url(#puntaAbierta)'/><text x='645.0' y='755' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10.3' fill='#1d7a46' text-anchor='middle' font-weight='600'>11b. 201 + transaction-response</text><text x='645.0' y='775' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='9.3' fill='#5c6b7a' text-anchor='middle' font-weight='normal'>de aqui sale Patient/1009</text>
<line x1='470' y1='840' x2='1010' y2='840' stroke='#5c6b7a' stroke-width='1.3' marker-end='url(#punta)'/><text x='740.0' y='833' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10.3' fill='#5c6b7a' text-anchor='middle' font-weight='600'>12. UPDATE usuario SET fhir_patient_id</text><text x='740.0' y='853' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='9.3' fill='#5c6b7a' text-anchor='middle' font-weight='normal'>el id real de HAPI: es lo que mide el tablero de cobertura</text>
<rect x='24' y='902' width='1132' height='76' rx='6' fill='#e8f1f8' stroke='#bcd6e8' stroke-width='1'/>
<text x='40' y='922' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#1b5e8f' text-anchor='start' font-weight='normal'>El ACK del paso 2 se manda ANTES de hablar con FHIR, y es deliberado: la sede no puede quedarse bloqueada esperando a un sistema que no</text>
<text x='40' y='939' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#1b5e8f' text-anchor='start' font-weight='normal'>es suyo, y si lo hiciera, un fallo de HAPI pararia la admision de pacientes en las tres sedes. A cambio, el bus se obliga a no perder el</text>
<text x='40' y='956' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#1b5e8f' text-anchor='start' font-weight='normal'>mensaje nunca: por eso existen la cola, los reintentos con retroceso exponencial y la cola de mensajes muertos.</text>
